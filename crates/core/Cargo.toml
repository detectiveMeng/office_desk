[package]
name = "niu_ma_workstation_core"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "NiuMa-Workstation —— 领域层（纯函数与纯数据结构，零 GPUI / SQLite 依赖）"

[dependencies]
# 日期：NaiveDate / NaiveDateTime / Datelike / Duration（serde 用于 JSON 导出/导入）
chrono = { version = "0.4", features = ["serde"] }

# 数据模型序列化（导出 / 导入 JSON）
serde = { version = "1", features = ["derive"] }